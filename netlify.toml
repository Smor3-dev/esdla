# Netlify: sitio estático en /public + funciones serverless en /netlify/functions.
# Las credenciales NO van acá: se cargan en Project configuration → Environment variables.

[build]
  publish = "public"
  command = "npm run build"   # typecheck: si el código no compila, no se publica

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Cabeceras de seguridad para todas las páginas.
# CSP estricta: solo scripts propios (sin inline), fuentes de Google y
# conexiones al propio dominio. Las APIs de MP/ML se llaman desde el servidor.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://www.mercadopago.com https://*.mercadopago.com https://*.mlstatic.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
